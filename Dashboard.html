<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="HandheldFriendly" content="true" />
<meta name="viewport" content="width=1072, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kobo Dashboard</title>

<style>
html, body { touch-action: manipulation; }
html, body{
margin:0; padding:0;
width:100%; height:100%;
overflow:hidden;
font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
background:#fff; color:#000;
}
:root { --gray:#ccc; --accent:#222; --pad:10px; --r:6px; }

body{
-webkit-tap-highlight-color: rgba(0,0,0,0);
-webkit-touch-callout:none;
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}
input, textarea{
-webkit-user-select:text;
-moz-user-select:text;
-ms-user-select:text;
user-select:text;
}

.wrap{
box-sizing:border-box;
width:1072px;
max-width:100%;
height:100%;
margin:0 auto;
padding:var(--pad);
position:relative;
}

.toprow{
width:100%;
border:2px solid #000;
border-radius:var(--r);
padding:var(--pad);
margin-bottom:var(--pad);
box-sizing:border-box;
}
.toprow table{ width:100%; border-collapse:collapse; table-layout:fixed; }
.toprow td{ vertical-align:top; }
.top-left{ width:50%; padding-right:8px; box-sizing:border-box; }
.top-right{ width:50%; border-left:2px solid #000; padding-left:12px; box-sizing:border-box; }

.title{
font-size:11px; font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
margin:0 0 4px 0;
}
.date{ font-size:14px; color:var(--accent); margin-bottom:4px; }
.big-clock{
font-size:56px; font-weight:800;
letter-spacing:-1px;
margin-top:4px;
line-height:1.0;
}
.ampm{ font-size:16px; font-weight:700; letter-spacing:0; }

.weather-head{
font-size:11px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
color:var(--accent);
margin-bottom:8px;
white-space:nowrap;
text-align:left;
width:100%;
overflow:hidden;
text-overflow:ellipsis;
}
.weather-head .loc{ font-weight:600; text-transform:none; }

.weather-row{ width:100%; overflow:hidden; }
.wbox{ width:49%; float:left; text-align:center; }
.wbox.right{ float:right; }
.wlabel{
font-size:10px; color:var(--accent);
margin-bottom:4px;
text-transform:uppercase;
letter-spacing:0.5px;
}
.wval{ font-size:32px; font-weight:800; line-height:1.05; }
.wdetail{ font-size:11px; color:var(--accent); margin-top:4px; font-style:italic; }
.status{
clear:both;
margin-top:8px;
font-size:10px;
color:#555;
text-align:right;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
display:block;
font-style:italic;
}

.forecast-bar{
width:100%;
border:2px solid #000;
border-radius:var(--r);
padding:8px;
margin-bottom:var(--pad);
margin-top:-2px;
box-sizing:border-box;
background:#fff;
overflow:hidden;
display:block;
}
.forecast-days{
display:table;
width:100%;
table-layout:fixed;
border-collapse:collapse;
}
.forecast-day{
display:table-cell;
width:14.28%;
text-align:center;
padding:6px 4px;
border:1px solid #ddd;
border-radius:4px;
background:#f9f9f9;
box-sizing:border-box;
vertical-align:top;
}
.forecast-day-name{
font-size:10px;
font-weight:700;
text-transform:uppercase;
margin-bottom:4px;
display:block;
}
.forecast-icon{ font-size:20px; margin:4px 0; display:block; }
.forecast-temp{ font-size:11px; font-weight:700; margin:4px 0; display:block; }
.forecast-precip{ font-size:9px; color:#666; display:block; }

.content{ width:100%; overflow:hidden; margin-top:-1px; }
.cols{
display:table;
width:100%;
height:100%;
table-layout:fixed;
border-spacing:0;
border-collapse:separate;
}
.col{
display:table-cell;
width:50%;
box-sizing:border-box;
vertical-align:top;
}

.card{
border:2px solid #000;
padding:var(--pad);
margin:0;
overflow:hidden;
height:100%;
box-sizing:border-box;
display:flex;
flex-direction:column;
min-height:0;
}
.col:first-child .card{
border-top-left-radius:var(--r);
border-bottom-left-radius:var(--r);
border-right:1px solid #000;
}
.col:last-child .card{
border-top-right-radius:var(--r);
border-bottom-right-radius:var(--r);
border-left:1px solid #000;
}

.card h2{
font-size:11px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
margin:0 0 8px 0;
padding-bottom:8px;
border-bottom:2px solid #000;
text-align:center;
flex:0 0 auto;
}

.card-body{
flex:1 1 auto;
overflow:hidden;
display:flex;
flex-direction:column;
min-height:0;
}

.tasks-inner{
padding:0 8px;
display:flex;
flex-direction:column;
height:100%;
overflow:hidden;
min-height:0;
}

/* Calendar */
.cal-head{
text-align:center;
font-weight:700;
margin-bottom:10px;
font-size:14px;
flex:0 0 auto;
}
#calendarGrid{ overflow:hidden; }
.cal-cell{
display:inline-block;
width:13.2%;
border:1px solid var(--gray);
text-align:center;
padding:6px 0;
font-size:12px;
margin:1px 0;
box-sizing:border-box;
position:relative;
}
.cal-dow{
font-weight:700;
border:none;
padding:2px 0;
font-size:10px;
text-transform:uppercase;
}
.cal-cell.other{ opacity:0.3; }
.cal-cell.today{
background:#f0f0f0;
color:#000;
font-weight:800;
border:2px solid #000;
}
.cal-cell.has-event::before{
content:"●";
position:absolute;
top:2px;
left:50%;
transform:translateX(-50%);
font-size:6px;
color:#000;
line-height:1;
}

/* Upcoming */
.upcoming-section{
margin-bottom:12px;
padding:8px 10px;
background:#f9f9f9;
border:1px solid #ddd;
border-radius:4px;
flex:0 0 auto;
}
.upcoming-header{
font-size:10px;
font-weight:700;
text-transform:uppercase;
letter-spacing:0.5px;
margin-bottom:8px;
color:var(--accent);
}
.upcoming-compact{
font-size:11px;
line-height:1.6;
}

.upcoming-item{
display:block;
margin-bottom:8px;
padding:6px;
background:#fff;
border:1px solid #ddd;
border-radius:4px;
}
.upcoming-item:last-child{ margin-bottom:0; }
.upcoming-item:active{ background:#e0e0e0; border-color:#999; }

.event-dot{
display:inline-block;
width:6px;
height:6px;
background:#000;
border-radius:50%;
margin-right:8px;
vertical-align:middle;
}
.upcoming-date{
display:inline-block;
font-weight:700;
font-size:10px;
color:#666;
vertical-align:middle;
}
/* single-line */
.upcoming-title{
display:block;
font-size:11px;
font-weight:600;
margin-top:3px;
padding-left:14px;
line-height:1.3;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* Todo list */
.todo-list{
flex:1 1 auto;
min-height:0;
overflow:auto;
-webkit-overflow-scrolling:touch;
box-sizing:border-box;
padding:0 4px;
}
.todo-item{
background:#f5f5f5;
border:1px solid #000;
border-radius:4px;
padding:8px 10px;
margin-bottom:8px;
display:block;
font-size:12px;
line-height:1.3;
overflow:hidden;
}
.todo-item.done{ opacity:0.5; text-decoration:line-through; }
.todo-item:active{ background:#e0e0e0; }

.todo-item input[type="checkbox"]{
width:18px;
height:18px;
vertical-align:middle;
margin-right:2px;
cursor:pointer;
pointer-events:auto;
}
/* single-line */
.todo-text{
display:inline-block;
width:80%;
vertical-align:middle;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
margin-left:6px;
font-size:11px;
}
</style>
</head>

<body>
<div class="wrap">
<div class="toprow">
<table>
<tr>
<td class="top-left">
<div class="title">Dashboard</div>
<div class="date" id="currentDate">Loading…</div>
<div class="big-clock" id="bigClock">--:-- <span class="ampm">--</span></div>
</td>
<td class="top-right">
<div class="weather-head">Weather · <span class="loc" id="locName">Kilkenny, Ireland</span></div>
<div class="weather-row">
<div class="wbox">
<div class="wlabel">Temperature</div>
<div class="wval" id="temp">--°</div>
<div class="wdetail" id="condition">—</div>
</div>
<div class="wbox right">
<div class="wlabel">Rain Chance</div>
<div class="wval" id="rainChance">--%</div>
<div class="wdetail" id="wind">— km/h</div>
</div>
<div class="status" id="weatherStatus">Last updated: —</div>
</div>
</td>
</tr>
</table>
</div>

<div class="forecast-bar">
<div class="forecast-days" id="forecastDays"></div>
</div>

<div class="content">
<div class="cols">
<div class="col">
<div class="card" id="calendarCard">
<h2>Calendar</h2>
<div class="card-body">
<div class="cal-head" id="calendarMonth">—</div>
<div id="calendarGrid"></div>
</div>
</div>
</div>

<div class="col">
<div class="card" id="tasksCard">
<h2>Tasks & Events</h2>
<div class="card-body">
<div class="tasks-inner">
<div class="upcoming-section">
<div class="upcoming-header">Upcoming</div>
<div class="upcoming-compact" id="upcomingList"></div>
</div>
<div class="todo-list" id="todoList"></div>
</div>
</div>
</div>
</div>

</div>
</div>
</div>

<script>
var LAT = 52.6541;
var LON = -7.2448;
var LOC_NAME = "Kilkenny, Ireland";
var TZ = "Europe/Dublin";

var CLOCK_EVERY_MS = 60 * 1000;
var WEATHER_EVERY_MS = 15 * 60 * 1000;
var FORECAST_EVERY_MS = 6 * 60 * 60 * 1000;
var FIREBASE_URL = 'https://kobo-dashboard-5039f-default-rtdb.firebaseio.com';

var calendarEvents = [];
var todos = [];
var previousEventsData = null;
var previousTodosData = null;

function pad2(n){ return n < 10 ? ("0" + n) : ("" + n); }

function formatTime12(d){
var h24 = d.getHours();
var mm = pad2(d.getMinutes());
var h12 = h24 % 12 || 12;
return h12 + ":" + mm;
}

function einkNudge(){
try{ document.body.offsetHeight; }catch(e){}
setTimeout(function(){ try{ document.body.offsetHeight; }catch(e){} }, 50);
}

function updateClocks(){
var now = new Date();
var h24 = now.getHours();
var mm = pad2(now.getMinutes());
var ampm = (h24 >= 12) ? "PM" : "AM";
var h12 = h24 % 12 || 12;

document.getElementById("bigClock").innerHTML =
h12 + ":" + mm + " <span class='ampm'>" + ampm + "</span>";

var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
document.getElementById("currentDate").innerHTML =
days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();

einkNudge();
}

function hasEvent(year, month, day){
for (var i = 0; i < calendarEvents.length; i++){
var e = calendarEvents[i].date;
if (e.getFullYear() === year && e.getMonth() === month && e.getDate() === day) return true;
}
return false;
}

function renderCalendar(){
var now = new Date();
var year = now.getFullYear();
var month = now.getMonth();
var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
document.getElementById("calendarMonth").innerHTML = monthNames[month] + " " + year;

var firstDay = new Date(year, month, 1).getDay();
var daysInMonth = new Date(year, month + 1, 0).getDate();
var daysInPrevMonth = new Date(year, month, 0).getDate();

var grid = document.getElementById("calendarGrid");
grid.innerHTML = "";

for (var d = 0; d < 7; d++){
var h = document.createElement("div");
h.className = "cal-cell cal-dow";
h.innerHTML = dayNames[d];
grid.appendChild(h);
}

for (var i = firstDay - 1; i >= 0; i--){
var c = document.createElement("div");
c.className = "cal-cell other";
c.innerHTML = "" + (daysInPrevMonth - i);
grid.appendChild(c);
}

for (var j = 1; j <= daysInMonth; j++){
var c2 = document.createElement("div");
c2.className = "cal-cell";
if (j === now.getDate()) c2.className += " today";
if (hasEvent(year, month, j)) c2.className += " has-event";
c2.innerHTML = "" + j;
grid.appendChild(c2);
}

var cells = grid.children.length;
while (cells < 7 + 42){
var c3 = document.createElement("div");
c3.className = "cal-cell other";
c3.innerHTML = " ";
grid.appendChild(c3);
cells++;
}

renderUpcoming();
einkNudge();
}

function deleteEvent(id){
var xhr = new XMLHttpRequest();
xhr.open('DELETE', FIREBASE_URL + '/events/' + id + '.json', true);
xhr.timeout = 10000;
xhr.onreadystatechange = function(){
if (xhr.readyState === 4 && xhr.status === 200) fetchEvents();
};
xhr.send();
}

function deleteTask(id){
var xhr = new XMLHttpRequest();
xhr.open('DELETE', FIREBASE_URL + '/todos/' + id + '.json', true);
xhr.timeout = 10000;
xhr.onreadystatechange = function(){
if (xhr.readyState === 4 && xhr.status === 200) fetchTodos();
};
xhr.send();
}

function toggleTask(id){
var task = null;
for (var i = 0; i < todos.length; i++){
if (todos[i].id === id){ task = todos[i]; break; }
}
if (!task) return;

var xhr = new XMLHttpRequest();
xhr.open('PATCH', FIREBASE_URL + '/todos/' + id + '.json', true);
xhr.timeout = 10000;
xhr.setRequestHeader('Content-Type', 'application/json');
xhr.onreadystatechange = function(){
if (xhr.readyState === 4 && xhr.status === 200) fetchTodos();
};
xhr.send(JSON.stringify({ done: !task.done }));
}

function renderUpcoming(){
var now = new Date();
var list = document.getElementById("upcomingList");
list.innerHTML = "";

var upcoming = calendarEvents.filter(function(e){
return e.date >= now;
}).sort(function(a,b){
return a.date - b.date;
}).slice(0, 3);

if (!upcoming.length){
list.innerHTML = '<div style="opacity:0.5;font-size:10px;padding-left:4px;">No upcoming events</div>';
return;
}

var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

upcoming.forEach(function(event){
var item = document.createElement("div");
item.className = "upcoming-item";
item.style.cursor = "pointer";
item.onclick = function(){
if (confirm("Delete event: " + event.title + "?")) deleteEvent(event.id);
};

var dateRow = document.createElement("div");

var dot = document.createElement("span");
dot.className = "event-dot";

var dateSpan = document.createElement("span");
dateSpan.className = "upcoming-date";
dateSpan.innerHTML = months[event.date.getMonth()] + " " + event.date.getDate();

var titleSpan = document.createElement("div");
titleSpan.className = "upcoming-title";
titleSpan.innerHTML = event.title;

dateRow.appendChild(dot);
dateRow.appendChild(dateSpan);
item.appendChild(dateRow);
item.appendChild(titleSpan);
list.appendChild(item);
});
}

function renderTodos(){
var list = document.getElementById("todoList");
list.innerHTML = "";

if (!todos.length){
var empty = document.createElement("div");
empty.className = "todo-item";
empty.style.textAlign = "center";
empty.style.opacity = "0.5";
empty.innerHTML = "No tasks yet";
list.appendChild(empty);
return;
}

for (var i=0; i<todos.length; i++){
(function(todo){
var row = document.createElement("div");
row.className = "todo-item" + (todo.done ? " done" : "");
row.style.cursor = "pointer";

var cb = document.createElement("input");
cb.type = "checkbox";
cb.checked = !!todo.done;
cb.onclick = function(e){
e.stopPropagation();
toggleTask(todo.id);
};

var text = document.createElement("span");
text.className = "todo-text";
text.innerHTML = todo.text;

row.onclick = function(e){
if (e.target === cb) return;
if (confirm("Delete task: " + todo.text + "?")) deleteTask(todo.id);
};

row.appendChild(cb);
row.appendChild(text);
list.appendChild(row);
})(todos[i]);
}
}

function describeWeather(code){
code = Number(code);
if (code === 0) return "Clear";
if (code === 1) return "Mostly clear";
if (code === 2) return "Partly cloudy";
if (code === 3) return "Overcast";
if (code === 45 || code === 48) return "Fog";
if (code === 51 || code === 53 || code === 55) return "Drizzle";
if (code === 56 || code === 57) return "Freezing drizzle";
if (code === 61) return "Light rain";
if (code === 63) return "Rain";
if (code === 65) return "Heavy rain";
if (code === 66 || code === 67) return "Freezing rain";
if (code === 71) return "Light snow";
if (code === 73) return "Snow";
if (code === 75) return "Heavy snow";
if (code === 77) return "Snow grains";
if (code === 80 || code === 81 || code === 82) return "Showers";
if (code === 85 || code === 86) return "Snow showers";
if (code === 95) return "Thunderstorm";
if (code === 96 || code === 99) return "Thunderstorm (hail)";
return "";
}

function iconForWeather(code){
code = Number(code);
if (code === 0) return "☀";
if (code === 1 || code === 2) return "⛅";
if (code === 3) return "☁";
if (code === 45 || code === 48) return "≡";
if (code === 51 || code === 53 || code === 55) return "∴";
if (code === 56 || code === 57) return "∴";
if (code === 61 || code === 63 || code === 65) return "☂";
if (code === 66 || code === 67) return "☂";
if (code === 71 || code === 73 || code === 75 || code === 77) return "❄";
if (code === 80 || code === 81 || code === 82) return "☂";
if (code === 85 || code === 86) return "❄";
if (code === 95 || code === 96 || code === 99) return "⚡";
return "○";
}

function setWeatherStatus(msg){
document.getElementById("weatherStatus").innerHTML = msg;
}

function findNearestHourlyIndex(times, now){
if (!times || !times.length) return -1;
var best = 0, bestDiff = Infinity, nowMs = now.getTime();
for (var i = 0; i < times.length; i++){
var t = new Date(times[i]);
var diff = Math.abs(t.getTime() - nowMs);
if (diff < bestDiff){ bestDiff = diff; best = i; }
}
return best;
}

function update7DayForecast(){
var url =
"https://api.open-meteo.com/v1/forecast"
+ "?latitude=" + encodeURIComponent(LAT)
+ "&longitude=" + encodeURIComponent(LON)
+ "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
+ "&timezone=" + encodeURIComponent(TZ)
+ "&forecast_days=7";

var xhr = new XMLHttpRequest();
xhr.open("GET", url, true);
xhr.timeout = 12000;
xhr.onreadystatechange = function(){
if (xhr.readyState !== 4) return;
if (xhr.status >= 200 && xhr.status < 300){
try{
var data = JSON.parse(xhr.responseText);
render7DayForecast(data.daily);
}catch(e){}
}
};
try{ xhr.send(); }catch(e){}
}

function render7DayForecast(daily){
if (!daily || !daily.time) return;
var container = document.getElementById("forecastDays");
container.innerHTML = "";
var dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

for (var i = 0; i < Math.min(7, daily.time.length); i++){
var date = new Date(daily.time[i]);
var dayName = (i === 0) ? "Today" : dayNames[date.getDay()];
var maxTemp = daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[i]) : "--";
var minTemp = daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[i]) : "--";
var weatherCode = daily.weather_code ? daily.weather_code[i] : 0;
var precipProb = daily.precipitation_probability_max ? Math.round(daily.precipitation_probability_max[i]) : 0;
var icon = iconForWeather(weatherCode);

var dayDiv = document.createElement("div");
dayDiv.className = "forecast-day";
dayDiv.innerHTML =
'<div class="forecast-day-name">' + dayName + '</div>' +
'<div class="forecast-icon">' + icon + '</div>' +
'<div class="forecast-temp">' + maxTemp + '° / ' + minTemp + '°</div>' +
'<div class="forecast-precip">' + precipProb + '%</div>';

container.appendChild(dayDiv);
}
einkNudge();
}

function updateWeather(){
document.getElementById("locName").innerHTML = LOC_NAME;

var url =
"https://api.open-meteo.com/v1/forecast"
+ "?latitude=" + encodeURIComponent(LAT)
+ "&longitude=" + encodeURIComponent(LON)
+ "&current_weather=true"
+ "&hourly=precipitation_probability"
+ "&timezone=" + encodeURIComponent(TZ);

setWeatherStatus("Updating…");

var xhr = new XMLHttpRequest();
xhr.open("GET", url, true);
xhr.timeout = 12000;
xhr.onreadystatechange = function(){
if (xhr.readyState !== 4) return;
if (xhr.status >= 200 && xhr.status < 300){
try{
var data = JSON.parse(xhr.responseText);
var w = data.current_weather;
if (!w){ setWeatherStatus("Last updated: —"); return; }

var ic = iconForWeather(w.weathercode);
document.getElementById("temp").innerHTML =
(ic ? (ic + " ") : "") + Math.round(w.temperature) + "°";
document.getElementById("wind").innerHTML = Math.round(w.windspeed) + " km/h";

var desc = describeWeather(w.weathercode);
document.getElementById("condition").innerHTML = desc ? desc : "—";

var pop = null;
if (data.hourly && data.hourly.time && data.hourly.precipitation_probability){
var idx = findNearestHourlyIndex(data.hourly.time, new Date());
if (idx >= 0 && idx < data.hourly.precipitation_probability.length){
pop = data.hourly.precipitation_probability[idx];
}
}
document.getElementById("rainChance").innerHTML =
(pop === null || pop === undefined) ? "--%" : (Math.round(pop) + "%");

setWeatherStatus("Last updated: " + formatTime12(new Date()));
einkNudge();
}catch(e){
setWeatherStatus("Last updated: —");
}
} else {
setWeatherStatus("Last updated: —");
}
};
xhr.ontimeout = function(){ setWeatherStatus("Last updated: —"); };
try{ xhr.send(); }catch(e){ setWeatherStatus("Last updated: —"); }
}

function forceEinkRefresh(){
var tasksCard = document.getElementById('tasksCard');
if (tasksCard){
tasksCard.style.display = 'none';
tasksCard.offsetHeight;
tasksCard.style.display = '';
}
var calendarCard = document.getElementById('calendarCard');
if (calendarCard){
calendarCard.style.display = 'none';
calendarCard.offsetHeight;
calendarCard.style.display = '';
}
for (var i = 0; i < 3; i++){
setTimeout(function(){
try{
document.body.offsetHeight;
if (document.body.style){
document.body.style.transform = 'translateZ(0)';
setTimeout(function(){ document.body.style.transform = ''; }, 10);
}
}catch(e){}
}, i * 100);
}
}

function fetchEvents(){
var xhr = new XMLHttpRequest();
xhr.open('GET', FIREBASE_URL + '/events.json?timestamp=' + (new Date().getTime()), true);
xhr.timeout = 10000;
xhr.onreadystatechange = function(){
if (xhr.readyState === 4 && xhr.status === 200){
try{
var data = JSON.parse(xhr.responseText);
var dataString = JSON.stringify(data);
if (dataString !== previousEventsData){
previousEventsData = dataString;
calendarEvents = [];
if (data){
for (var key in data){
calendarEvents.push({
id:key,
date:new Date(data[key].date),
title:data[key].title
});
}
}
renderCalendar();
forceEinkRefresh();
}
}catch(e){}
}
};
xhr.send();
}

function fetchTodos(){
var xhr = new XMLHttpRequest();
xhr.open('GET', FIREBASE_URL + '/todos.json?timestamp=' + (new Date().getTime()), true);
xhr.timeout = 10000;
xhr.onreadystatechange = function(){
if (xhr.readyState === 4 && xhr.status === 200){
try{
var data = JSON.parse(xhr.responseText);
var dataString = JSON.stringify(data);
if (dataString !== previousTodosData){
previousTodosData = dataString;
todos = [];
if (data){
for (var key in data){
todos.push({
id:key,
text:data[key].text,
done:data[key].done || false
});
}
}
renderTodos();
forceEinkRefresh();
}
}catch(e){}
}
};
xhr.send();
}

function startTimers(){
updateClocks();
renderCalendar();
updateWeather();
update7DayForecast();
fetchEvents();
fetchTodos();

setInterval(updateClocks, CLOCK_EVERY_MS);
setInterval(updateWeather, WEATHER_EVERY_MS);
setInterval(update7DayForecast, FORECAST_EVERY_MS);

setInterval(function(){
fetchEvents();
fetchTodos();
}, 30 * 1000);
}

startTimers();
</script>
