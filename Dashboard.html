<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="viewport" content="width=1072, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kobo Dashboard</title>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f7f7f7;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .page {
      width: 100%;
      height: 100%;
      padding: 18px 18px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 2px solid #e6e6e6;
      border-radius: 14px;
    }

    .time {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .date {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
    }

    .slide {
      flex: 1;
      min-height: 0;
      background: #fff;
      border: 2px solid #e6e6e6;
      border-radius: 16px;
      padding: 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
      flex: 1;
    }

    .card {
      background: #fff;
      border: 2px solid #ededed;
      border-radius: 14px;
      padding: 12px;
      box-sizing: border-box;
      min-height: 0;
      overflow: hidden;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #111;
    }

    .muted { color: #666; font-weight: 600; }

    .big {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .small { font-size: 16px; font-weight: 700; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid #efefef;
      background: #fafafa;
    }
    .item .line1 { display: block; font-size: 18px; font-weight: 900; color: #111; }
    .item .line2 { display: block; font-size: 16px; font-weight: 700; color: #444; margin-top: 2px; }
    .dot { font-weight: 900; margin-right: 6px; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #666;
      padding: 0 4px;
    }

    .fade {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms linear;
    }
    .fade.on { opacity: 1; }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid #e8e8e8;
      background: #fff;
      color: #444;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="fade" id="fade"></div>

  <div class="page">
    <div class="topbar">
      <div>
        <div class="time" id="clockTime">--:--</div>
      </div>
      <div class="date" id="clockDate">---</div>
    </div>

    <div class="slide" id="slideRoot">
      <!-- rendered -->
    </div>

    <div class="footer">
      <div class="pill" id="slideLabel">Slide 1/1</div>
      <div class="pill" id="statusLabel">Loading…</div>
    </div>
  </div>

  <script>
    // ====== CONFIG ======
    // Firebase Realtime Database REST base (NO trailing slash)
    const DB = "https://kobo-dashboard-5039f-default-rtdb.firebaseio.com";

    // Your location (Dublin default). Change these.
    const LAT = 53.3498;
    const LON = -6.2603;

    // Rotate slides every N seconds if layout has multiple slides
    const SLIDE_ROTATE_SECONDS = 20;

    // Polling (Kobo-friendly)
    const POLL_DATA_SECONDS = 60;
    const POLL_TRIGGER_SECONDS = 10;

    // ====== STATE ======
    let layoutConfig = { slides: [{ layout: "full", modules: ["clock","weather","forecast","calendar","tasks"] }] };
    let events = [];
    let todos = [];
    let weather = null;
    let forecast = null;

    let slideIndex = 0;
    let lastTrigger = null;
    let lastUpdated = 0;

    // ====== UTILS ======
    function escapeHTML(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fbUrl(path) {
      const bust = "ts=" + Date.now();
      return DB + "/" + path + ".json?" + bust;
    }

    function hardRefreshEink() {
      // Simple repaint pulse
      const f = document.getElementById("fade");
      f.classList.add("on");
      setTimeout(() => f.classList.remove("on"), 120);
    }

    function setStatus(msg) {
      document.getElementById("statusLabel").textContent = msg;
    }

    function fmtTime(d) {
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function fmtDate(d) {
      return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    }

    function parseEvents(raw) {
      if (!raw) return [];
      const out = [];
      Object.keys(raw).forEach((id) => {
        const e = raw[id];
        if (!e || !e.date) return;
        const dt = new Date(e.date);
        out.push({ id, title: (e.title || ""), date: dt });
      });
      out.sort((a,b) => a.date - b.date);
      return out;
    }

    function parseTodos(raw) {
      if (!raw) return [];
      const out = [];
      Object.keys(raw).forEach((id) => {
        const t = raw[id];
        if (!t) return;
        out.push({ id, text: (t.text || ""), done: !!t.done });
      });
      return out;
    }

    // ====== CLOCK ======
    function tickClock() {
      const now = new Date();
      document.getElementById("clockTime").textContent = fmtTime(now);
      document.getElementById("clockDate").textContent = fmtDate(now);
    }

    // ====== WEATHER (Open-Meteo) ======
    async function fetchWeather() {
      // current + daily forecast summary
      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + encodeURIComponent(LAT) +
        "&longitude=" + encodeURIComponent(LON) +
        "&current=temperature_2m,precipitation,weather_code,wind_speed_10m" +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
        "&forecast_days=3" +
        "&timezone=auto";

      const r = await fetch(url);
      const j = await r.json();

      weather = j.current || null;
      forecast = j.daily || null;
    }

    // ====== FIREBASE DATA ======
    async function fetchLayoutEventsTodos() {
      const [layoutRaw, eventsRaw, todosRaw] = await Promise.all([
        fetch(fbUrl("config/layout")).then(r => r.json()),
        fetch(fbUrl("events")).then(r => r.json()),
        fetch(fbUrl("todos")).then(r => r.json())
      ]);

      layoutConfig = layoutRaw || layoutConfig;
      events = parseEvents(eventsRaw);
      todos = parseTodos(todosRaw);
      lastUpdated = Date.now();
    }

    async function checkTrigger() {
      const raw = await fetch(fbUrl("refreshTrigger")).then(r => r.json());
      const trig = raw ? (raw.timestamp + ":" + raw.trigger) : null;

      if (lastTrigger === null) {
        lastTrigger = trig;
        return;
      }

      if (trig && trig !== lastTrigger) {
        lastTrigger = trig;
        setStatus("Syncing…");
        await refreshAll(true);
      }
    }

    // ====== RENDER ======
    function moduleClockCard() {
      return `
        <div class="card">
          <div class="title">Now</div>
          <div class="big">${escapeHTML(document.getElementById("clockTime").textContent)}</div>
          <div class="small muted">${escapeHTML(document.getElementById("clockDate").textContent)}</div>
        </div>
      `;
    }

    function moduleWeatherCard() {
      if (!weather) {
        return `<div class="card"><div class="title">Weather</div><div class="muted">Loading…</div></div>`;
      }
      const temp = weather.temperature_2m;
      const wind = weather.wind_speed_10m;
      const precip = weather.precipitation;

      return `
        <div class="card">
          <div class="title">Weather</div>
          <div class="row">
            <div class="big">${Math.round(temp)}°</div>
            <div class="small muted">Wind ${Math.round(wind)} km/h</div>
          </div>
          <div class="small muted">Precip now: ${precip} mm</div>
        </div>
      `;
    }

    function moduleForecastCard() {
      if (!forecast || !forecast.time) {
        return `<div class="card"><div class="title">Forecast</div><div class="muted">Loading…</div></div>`;
      }

      const lines = [];
      for (let i = 0; i < Math.min(3, forecast.time.length); i++) {
        const d = new Date(forecast.time[i] + "T00:00:00");
        const max = forecast.temperature_2m_max[i];
        const min = forecast.temperature_2m_min[i];
        const pop = forecast.precipitation_probability_max ? forecast.precipitation_probability_max[i] : null;
        lines.push(`
          <div class="item">
            <span class="line1">${escapeHTML(d.toLocaleDateString([], { weekday: "short" }))}</span>
            <span class="line2">${Math.round(min)}–${Math.round(max)}°${pop !== null ? (" · " + Math.round(pop) + "% rain") : ""}</span>
          </div>
        `);
      }

      return `
        <div class="card">
          <div class="title">Forecast</div>
          <div class="list">${lines.join("")}</div>
        </div>
      `;
    }

    function moduleCalendarCard() {
      const now = new Date();
      const upcoming = events
        .filter(e => e.date >= new Date(now.getTime() - 60 * 1000))
        .slice(0, 4);

      if (upcoming.length === 0) {
        return `<div class="card"><div class="title">Calendar</div><div class="muted">No upcoming events</div></div>`;
      }

      const items = upcoming.map((e) => {
        const isToday = e.date.toDateString() === now.toDateString();
        const dateLabel = e.date.toLocaleDateString([], { month: "short", day: "numeric" });
        const timeLabel = e.date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        return `
          <div class="item">
            <span class="line1">${isToday ? '<span class="dot">●</span>' : ''}${escapeHTML(dateLabel)} ${escapeHTML(timeLabel)}</span>
            <span class="line2">${escapeHTML(e.title)}</span>
          </div>
        `;
      }).join("");

      return `
        <div class="card">
          <div class="title">Calendar</div>
          <div class="list">${items}</div>
        </div>
      `;
    }

    function moduleTasksCard() {
      const open = todos.filter(t => !t.done).slice(0, 6);

      if (open.length === 0) {
        return `<div class="card"><div class="title">Tasks</div><div class="muted">All done</div></div>`;
      }

      const items = open.map((t) => `
        <div class="item">
          <span class="line1">${escapeHTML(t.text)}</span>
        </div>
      `).join("");

      return `
        <div class="card">
          <div class="title">Tasks</div>
          <div class="list">${items}</div>
        </div>
      `;
    }

    function renderSlide() {
      const slides = (layoutConfig && layoutConfig.slides && layoutConfig.slides.length) ? layoutConfig.slides : [];
      if (slides.length === 0) {
        document.getElementById("slideRoot").innerHTML = `<div class="muted">No layout configured</div>`;
        return;
      }

      slideIndex = slideIndex % slides.length;
      const s = slides[slideIndex];
      const mods = s.modules || [];

      // Decide layout
      const twoCol = mods.length >= 2;

      function cardFor(mod) {
        if (mod === "clock") return moduleClockCard();
        if (mod === "weather") return moduleWeatherCard();
        if (mod === "forecast") return moduleForecastCard();
        if (mod === "calendar") return moduleCalendarCard();
        if (mod === "tasks") return moduleTasksCard();
        return "";
      }

      const cards = mods.map(cardFor).filter(Boolean);

      let html = "";
      if (twoCol) {
        html = `<div class="grid-2">${cards.join("")}</div>`;
      } else {
        html = cards.join("");
      }

      document.getElementById("slideRoot").innerHTML = html;
      document.getElementById("slideLabel").textContent = "Slide " + (slideIndex + 1) + "/" + slides.length;
    }

    // ====== LOOP ======
    async function refreshAll(withEinkPulse) {
      try {
        await Promise.all([
          fetchLayoutEventsTodos(),
          fetchWeather()
        ]);

        renderSlide();
        setStatus("Updated " + new Date(lastUpdated).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));

        if (withEinkPulse) hardRefreshEink();
      } catch (e) {
        setStatus("Error");
      }
    }

    function startSlideRotation() {
      setInterval(() => {
        const slides = (layoutConfig && layoutConfig.slides) ? layoutConfig.slides : [];
        if (!slides || slides.length <= 1) return;
        slideIndex = (slideIndex + 1) % slides.length;
        renderSlide();
        hardRefreshEink();
      }, SLIDE_ROTATE_SECONDS * 1000);
    }

    // ====== START ======
    tickClock();
    setInterval(tickClock, 1000 * 10);

    refreshAll(false);
    setInterval(() => refreshAll(false), POLL_DATA_SECONDS * 1000);
    setInterval(() => checkTrigger(), POLL_TRIGGER_SECONDS * 1000);

    startSlideRotation();
  </script>
</body>
</html>
